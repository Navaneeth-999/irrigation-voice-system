name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_irrigation_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend typecheck and lint
        run: |
          cd backend
          npm run typecheck

      - name: Run backend migrations and reference seed
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_irrigation_db
          DIRECT_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_irrigation_db
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_irrigation_db
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_security
        run: |
          cd backend
          npm run migrate
          npm run seed:reference

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_irrigation_db
          DIRECT_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_irrigation_db
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_irrigation_db
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_security
        run: |
          cd backend
          npm test

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend typecheck and build
        run: |
          cd frontend
          npm run build
